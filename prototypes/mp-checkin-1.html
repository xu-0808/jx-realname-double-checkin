<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>温馨提示 - 赣建宝</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #e8ecf1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .phone {
      width: 380px;
      background: #fff;
      height: 100%;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .status-bar {
      height: 44px;
      background: linear-gradient(135deg, #2563ff 0%, #1e90ff 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .status-bar .time { font-size: 15px; }
    .status-bar .icons { display: flex; align-items: center; gap: 5px; }
    .status-bar .icons svg { width: 16px; height: 16px; fill: currentColor; }
    .status-bar .battery { display: flex; align-items: center; gap: 2px; font-size: 13px; }

    .header {
      background: linear-gradient(135deg, #2563ff 0%, #1e90ff 100%);
      padding: 12px 16px 32px;
      color: #fff;
      position: relative;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header-title { font-size: 17px; font-weight: 500; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .header-actions svg { width: 22px; height: 22px; }

    .user-info { display: flex; align-items: center; gap: 14px; }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: #e6f0ff;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar svg { width: 100%; height: 100%; }
    .user-meta { flex: 1; }
    .user-name { font-size: 20px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .badge {
      background: #ffb347;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .badge svg { width: 10px; height: 10px; fill: currentColor; }
    .edit-btn {
      background: rgba(255,255,255,0.22);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .edit-btn svg { width: 12px; height: 12px; }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      background: #fff;
      padding: 16px 0 8px;
      filter: brightness(0.7);
    }
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      text-decoration: none;
      color: #333;
    }
    .menu-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      color: #fff;
    }
    .menu-icon svg { width: 26px; height: 26px; fill: currentColor; }
    .menu-text { font-size: 12px; color: #555; }

    .icon-pink { background: linear-gradient(135deg, #ff8da1, #ffb3c1); }
    .icon-cyan { background: linear-gradient(135deg, #4ecdc4, #7fdbda); }
    .icon-purple { background: linear-gradient(135deg, #a78bfa, #c4b5fd); }
    .icon-orange { background: linear-gradient(135deg, #ff9f68, #ffbf96); }
    .icon-blue { background: linear-gradient(135deg, #60a5fa, #93c5fd); }
    .icon-yellow { background: linear-gradient(135deg, #fbbf24, #fcd34d); }
    .icon-red { background: linear-gradient(135deg, #f87171, #fca5a5); }
    .icon-indigo { background: linear-gradient(135deg, #818cf8, #a5b4fc); }
    .icon-rose { background: linear-gradient(135deg, #fb7185, #fda4af); }
    .icon-amber { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .icon-slate { background: linear-gradient(135deg, #94a3b8, #cbd5e1); }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      z-index: 100;
    }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
    }
    .modal-title {
      font-size: 15px;
      color: #333;
      line-height: 1.7;
      margin-bottom: 14px;
    }
    .modal-row {
      font-size: 15px;
      color: #333;
      margin-bottom: 6px;
      line-height: 1.6;
    }
    .modal-btn {
      width: 100%;
      background: #1e90ff;
      color: #fff;
      border: none;
      border-radius: 22px;
      padding: 12px;
      font-size: 16px;
      margin-top: 18px;
      cursor: pointer;
    }

    .tabbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      align-items: center;
      filter: brightness(0.7);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #999;
      font-size: 11px;
      text-decoration: none;
    }
    .tab-item.active { color: #2563ff; }
    .tab-item svg { width: 22px; height: 22px; }

    .content-bottom { padding-bottom: 70px; }
    /* === iPhone 17 Pro Frame === */
    .phone-frame {
      background: #1a1c1e;
      border-radius: 22px;
      padding: 10px;
      box-shadow:
        0 0 0 2px #2d2f31,
        0 0 0 5px #1a1c1e,
        0 10px 45px rgba(0,0,0,0.45);
      position: relative;
      display: inline-block;
    }
    .phone-screen {
      width: 380px;
      height: 844px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid #333;
    }
    .punch-hole {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 50%;
      z-index: 100;
    }
    .home-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
      z-index: 100;
    }
    .side-btn {
      position: absolute;
      background: #2d2f31;
      border-radius: 2px;
      opacity: 0.7;
    }
    .btn-power {
      right: -3px; top: 190px;
      width: 2px; height: 55px;
    }
    .btn-vol-up {
      left: -3px; top: 180px;
      width: 2px; height: 38px;
    }
    .btn-vol-down {
      left: -3px; top: 225px;
      width: 2px; height: 38px;
    }
    /* ========================= */
  </style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-screen">
    <div class="punch-hole"></div>
    <div class="phone">
    <div class="status-bar">
      <span class="time">10:23</span>
      <div class="icons">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M17 4h-3V2h-4v2H7v18h10V4zm-4 16h-2v-2h2v2zm0-4h-2V8h2v8z"/></svg>
        <span class="battery">
          <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
          78

      </div>
    </div>

    <div class="header">
      <div class="header-top">
        <div class="header-title">我的</div>
        <div class="header-actions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </div>
      </div>
      <div class="user-info">
        <div class="avatar">
          <svg viewBox="0 0 64 64" fill="#2563ff"><circle cx="32" cy="24" r="12"/><ellipse cx="32" cy="58" rx="22" ry="18"/></svg>
        </div>
        <div class="user-meta">
          <div class="user-name">德小拓</div>
          <div style="margin-bottom: 8px;">
            <span class="badge">
              <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              已实名

          </div>
          <button class="edit-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            完善资料
          </button>
        </div>
      </div>
    </div>

    <div class="content-bottom">
      <div class="menu-grid">
        <div class="menu-item">
          <div class="menu-icon icon-pink">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm-8 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
          </div>
          <span class="menu-text">岗位人员打卡</span>
        </div>
        <div class="menu-item">
          <div class="menu-icon icon-cyan">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3 3"/></svg>
          </div>
          <span class="menu-text">移动打卡</span>
        </div>
        <div class="menu-item">
          <div class="menu-icon icon-purple">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2v4M16 2v4M3 10h18"/><text x="12" y="17" text-anchor="middle" font-size="8" fill="currentColor" font-weight="bold">28</text></svg>
          </div>
          <span class="menu-text">考勤统计</span>
        </div>
        <div class="menu-item">
          <div class="menu-icon icon-orange">
            <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="12" y1="18" x2="12" y2="18.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <span class="menu-text">辅助打卡</span>
        </div>
      </div>
    </div>

    <div class="modal-overlay">
      <div class="modal">
        <div class="modal-title">
          温馨提示：为了避免对您的考勤进行异常预警，请您每次打卡都在项目上的WiFi下进行打卡；如果无线网名称不显示，请移除小程序重新扫码或将手机SIM卡拔出重新插入，再重新登录小程序尝试打卡
        </div>
        <div class="modal-row">WiFi名称：ditop2-5g</div>
        <div class="modal-row">IP地址：</div>
        <div class="modal-row">IP地址查询请使用百度搜索“IP地址”查询自己的IP地址</div>
        <div class="modal-row">不建议使用手机热点进行打卡，使用手机热点打卡系统会判定为异常打卡</div>
        <a href="mp-checkin-2.html"><button class="modal-btn">我已知晓</button></a>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span>工程项目</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/></svg>
        <span>培训教育</span>
      </div>
      <div class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>消息公告</span>
      </div>
      <div class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </div>
    </div>
  </div>
    <div class="home-bar"></div>
  </div>
  <div class="side-btn btn-power"></div>
  <div class="side-btn btn-vol-up"></div>
  <div class="side-btn btn-vol-down"></div>
</div>
</body>
</html>
