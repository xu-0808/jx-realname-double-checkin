<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工程项目 - 赣建宝</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #e8ecf1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .phone {
      width: 380px;
      background: #f5f7fa;
      height: 100%;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .status-bar {
      height: 44px;
      background: linear-gradient(135deg, #2563ff 0%, #1e90ff 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .status-bar .time { font-size: 15px; }
    .status-bar .icons { display: flex; align-items: center; gap: 5px; }
    .status-bar .icons svg { width: 16px; height: 16px; fill: currentColor; }
    .status-bar .battery { display: flex; align-items: center; gap: 2px; font-size: 13px; }

    .header {
      background: linear-gradient(135deg, #2563ff 0%, #1e90ff 100%);
      padding: 10px 16px 0;
      color: #fff;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-left svg { width: 22px; height: 22px; }
    .header-title { font-size: 16px; font-weight: 500; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .header-actions svg { width: 22px; height: 22px; }

    .sub-tabs {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 14px;
    }
    .sub-tab {
      padding-bottom: 10px;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      position: relative;
    }
    .sub-tab.active {
      color: #fff;
      font-weight: 500;
    }
    .sub-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: #fff;
      border-radius: 2px;
    }

    .content {
      padding: 12px;
      padding-bottom: 76px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }
    .card-icon {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card-icon svg { width: 14px; height: 14px; }
    .card-extra { font-size: 14px; color: #666; }
    .card-extra span { color: #2563ff; font-weight: 500; }

    .progress-badge {
      display: inline-block;
      background: #ff7a45;
      color: #fff;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .progress-bar {
      height: 8px;
      background: #e6f0ff;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffd666, #ff7a45);
      border-radius: 4px;
    }
    .progress-text { font-size: 13px; color: #666; }
    .progress-text strong { color: #ff7a45; font-weight: 600; }

    .stat-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .stat-box {
      flex: 1;
      background: #f5f7fa;
      border-radius: 8px;
      padding: 14px 0;
      text-align: center;
    }
    .stat-num { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    .stat-num.blue { color: #2563ff; }
    .stat-num.orange { color: #ff9f43; }
    .stat-num.cyan { color: #00c8c8; }
    .stat-label { font-size: 12px; color: #666; }

    .subject-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }
    .subject-tag {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background: #2563ff;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .subject-info { flex: 1; }
    .subject-name { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 3px; }
    .subject-type { font-size: 12px; color: #999; }
    .subject-contact {
      margin-top: 12px;
      padding: 10px;
      background: #f8f9fb;
      border-radius: 6px;
      font-size: 13px;
      color: #666;
      line-height: 1.8;
    }

    .tabbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #999;
      font-size: 11px;
      text-decoration: none;
    }
    .tab-item.active { color: #2563ff; }
    .tab-item svg { width: 22px; height: 22px; }

    /* === Xiaomi 15 Pro Frame === */
    .phone-frame {
      background: #1a1c1e;
      border-radius: 22px;
      padding: 10px;
      box-shadow:
        0 0 0 2px #2d2f31,
        0 0 0 5px #1a1c1e,
        0 10px 45px rgba(0,0,0,0.45);
      position: relative;
      display: inline-block;
    }
    .phone-screen {
      width: 380px;
      height: 844px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid #333;
    }
    .punch-hole {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 50%;
      z-index: 100;
    }
    .home-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
      z-index: 100;
    }
    .side-btn {
      position: absolute;
      background: #2d2f31;
      border-radius: 2px;
      opacity: 0.7;
    }
    .btn-power {
      right: -3px; top: 190px;
      width: 2px; height: 55px;
    }
    .btn-vol-up {
      left: -3px; top: 180px;
      width: 2px; height: 38px;
    }
    .btn-vol-down {
      left: -3px; top: 225px;
      width: 2px; height: 38px;
    }
    /* ========================= */
  </style>
</head>
<body>
  <div class="phone-frame">
  <div class="phone-screen">
    <div class="punch-hole"></div>
    <div class="phone">
    <div class="status-bar">
      <span class="time">10:29</span>
      <div class="icons">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M17 4h-3V2h-4v2H7v18h10V4zm-4 16h-2v-2h2v2zm0-4h-2V8h2v8z"/></svg>
        <span class="battery">

          76

      </div>
    </div>

    <div class="header">
      <div class="header-top">
        <div class="header-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <div class="header-title">测试豫章师范学院新建教育...</div>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>

      </div>
      <div class="sub-tabs">

    </div>

    <div class="content">
      <div class="card">

            <div class="card-icon" style="background: #ff7a45;">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="16" r="1.5" fill="currentColor"/></svg>
            </div>

      </div>

      <div class="card">

          <div class="card-title">
            <div class="card-icon" style="background: #ff9f43;">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="1.5"/><path d="M8 14h2v2H8zM14 14h2v2h-2z" fill="currentColor"/></svg>
            </div>

          </div>

        </div>
        <div class="stat-row">
          <div class="stat-box">

          </div>
          <div class="stat-box">

            <div class="stat-label">劳务人员</div>
          </div>
          <div class="stat-box">
            <div class="stat-num cyan">1</div>
            <div class="stat-label">岗位人员</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon" style="background: #ff5a5a;">
              <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 7h6M9 12h6M9 17h4" stroke="currentColor" stroke-width="1.5"/></svg>
            </div>
            责任主体
          </div>
        </div>
        <div class="subject-item">
          <div class="subject-tag">建设</div>
          <div class="subject-info">
            <div class="subject-name">豫章师范学院</div>
            <div class="subject-type">建设单位</div>
          </div>
        </div>
        <div class="subject-contact">
          <div>项目负责人：</div>
          <div>联系电话：</div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <a href="mp-project.html" class="tab-item active">

        <span>工程项目</span>
      </a>
      <a href="#" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/></svg>
        <span>培训教育</span>
      </a>
      <a href="mp-message.html" class="tab-item">

        <span>消息公告</span>
      </a>
      <a href="mp-my.html" class="tab-item">

      </a>
    </div>
  </div>
    <div class="home-bar"></div>
  </div>
  <div class="side-btn btn-power"></div>
  <div class="side-btn btn-vol-up"></div>
  <div class="side-btn btn-vol-down"></div>
</div>
</body>
</html>
