<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>岗位人员打卡 - 赣建宝</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #e8ecf1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .phone {
      width: 380px;
      background: #fff;
      height: 100%;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .status-bar {
      height: 44px;
      background: linear-gradient(135deg, #2563ff 0%, #1e90ff 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .status-bar .time { font-size: 15px; }
    .status-bar .icons { display: flex; align-items: center; gap: 5px; }
    .status-bar .icons svg { width: 16px; height: 16px; fill: currentColor; }
    .status-bar .battery { display: flex; align-items: center; gap: 2px; font-size: 13px; }

    .header {
      background: linear-gradient(135deg, #2563ff 0%, #1e90ff 100%);
      padding: 8px 16px 50px;
      color: #fff;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .back-btn {
      width: 36px;
      display: flex;
      align-items: center;
    }
    .back-btn svg { width: 22px; height: 22px; }
    .header-title { font-size: 17px; font-weight: 500; flex: 1; text-align: center; }
    .header-actions { display: flex; align-items: center; gap: 14px; }
    .header-actions svg { width: 22px; height: 22px; }

    .project-selector {
      background: rgba(255,255,255,0.18);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }
    .project-icon {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2563ff;
      flex-shrink: 0;
    }
    .project-icon svg { width: 22px; height: 22px; }
    .project-name {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
    }
    .project-arrow svg { width: 18px; height: 18px; }

    .content {
      background: #f8f9fa;
      border-radius: 16px 16px 0 0;
      margin-top: -24px;
      position: relative;
      padding: 24px 16px 30px;
      min-height: calc(100vh - 170px);
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .checkin-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      cursor: pointer;
      text-decoration: none;
    }
    .checkin-text { font-size: 24px; font-weight: 500; }
    .checkin-time { font-size: 14px; margin-top: 6px; opacity: 0.95; }
    .location-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #52c41a;
      font-size: 14px;
    }
    .location-status svg { width: 16px; height: 16px; }

    .warning-text {
      color: #ff4d4f;
      font-size: 13px;
      line-height: 1.6;
      margin: 0 4px 16px;
    }

    .timeline-card {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
    }
    .timeline-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .timeline {
      position: relative;
      padding-left: 20px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 6px;
      bottom: 20px;
      width: 2px;
      background: #e0e0e0;
    }
    .timeline-item { position: relative; margin-bottom: 18px; }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-dot {
      position: absolute;
      left: -19px;
      top: 5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1e90ff;
      border: 2px solid #fff;
    }
    .timeline-item.gray .timeline-dot {
      background: #bbb;
    }
    .timeline-item.gray .timeline-label { color: #999; }
    .timeline-label {
      font-size: 15px;
      color: #333;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .timeline-detail {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
      line-height: 1.5;
    }
    .timeline-detail svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
    .timeline-detail .label { color: #999; min-width: 64px; }
    /* === iPhone 17 Pro Frame === */
    .phone-frame {
      background: #1a1c1e;
      border-radius: 22px;
      padding: 10px;
      box-shadow:
        0 0 0 2px #2d2f31,
        0 0 0 5px #1a1c1e,
        0 10px 45px rgba(0,0,0,0.45);
      position: relative;
      display: inline-block;
    }
    .phone-screen {
      width: 380px;
      height: 844px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid #333;
    }
    .punch-hole {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 50%;
      z-index: 100;
    }
    .home-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
      z-index: 100;
    }
    .side-btn {
      position: absolute;
      background: #2d2f31;
      border-radius: 2px;
      opacity: 0.7;
    }
    .btn-power {
      right: -3px; top: 190px;
      width: 2px; height: 55px;
    }
    .btn-vol-up {
      left: -3px; top: 180px;
      width: 2px; height: 38px;
    }
    .btn-vol-down {
      left: -3px; top: 225px;
      width: 2px; height: 38px;
    }
    /* === Demo Panel outside phone === */
    .demo-wrapper {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .demo-panel-card {
      width: 250px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      padding: 16px;
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .demo-panel-title {
      font-size: 14px;
      color: #1e293b;
      font-weight: 600;
      text-align: center;
    }
    .demo-panel-subtitle {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 4px;
    }
    .demo-scenario {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #fff;
      font-size: 12px;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      width: 100%;
    }
    .demo-scenario:hover { border-color: #94a3b8; background: #f8fafc; }
    .demo-scenario.active {
      border-color: #3b82f6;
      background: #eff6ff;
      color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.18);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot.orange { background: #f97316; }
    .dot.blue   { background: #3b82f6; }
    .dot.green  { background: #22c55e; }
    .demo-hint {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
    }
    /* === 场景二：双人验证提示 === */
    .double-warning {
      display: none;
      background: #fff7e6;
      border: 1px solid #ffd591;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 13px;
      color: #d46b08;
      text-align: center;
      line-height: 1.6;
    }
    .double-warning.show { display: block; }
    /* ========================= */
  </style>
</head>
<body>
  <div class="demo-wrapper">
  <div class="phone-frame">
  <div class="phone-screen">
    <div class="punch-hole"></div>
    <div class="phone">
    <div class="status-bar">
      <span class="time">10:23</span>
      <div class="icons">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M17 4h-3V2h-4v2H7v18h10V4zm-4 16h-2v-2h2v2zm0-4h-2V8h2v8z"/></svg>
        <span class="battery">
          <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
          78
        </span>
      </div>
    </div>

    <div class="header">
      <div class="header-top">
        <a href="mp-my.html" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="header-title">岗位人员打卡</div>
        <div class="header-actions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </div>
      </div>
      <div class="project-selector">
        <div class="project-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/><path d="M7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
        </div>
        <div class="project-name">测试豫章师范学院新建教育实验实训大楼一期</div>
        <div class="project-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <a href="mp-checkin-4.html" class="checkin-btn">
          <span class="checkin-text">下班</span>
          <span class="checkin-time">10:23:40</span>
        </a>
        <div class="location-status">
          <svg viewBox="0 0 24 24" fill="#52c41a"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          <span>您已进入项目考勤区域</span>
        </div>
        <div class="double-warning" id="doubleWarning">⚠ 被抽中双人验证尚未完成，请点击打卡继续完成</div>
      </div>

      <div class="warning-text">
        岗位人员打卡功能升级中，考勤位置展示延迟，请在打完卡6小时后再查看
      </div>

      <div class="timeline-card">
        <div class="timeline-title">打卡记录</div>
        <div class="timeline">
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-label">上班打卡 10:20</div>
            <div class="timeline-detail">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <span class="label">打卡方式：</span>
              <span>移动打卡</span>
            </div>
            <div class="timeline-detail">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
              <span class="label">WiFi名称：</span>
              <span>ditop2-5g</span>
            </div>
            <div class="timeline-detail">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="7" cy="12" r="1.5" fill="currentColor"/><path d="M12 12h6" stroke-linecap="round"/></svg>
              <span class="label">IP地址：</span>
              <span>192.168.110.102</span>
            </div>
            <div class="timeline-detail">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span class="label">考勤位置：</span>
              <span></span>
            </div>
          </div>
          <div class="timeline-item gray" id="tl-offduty">
            <div class="timeline-dot"></div>
            <div class="timeline-label" id="tl-offduty-label">下班打卡</div>
            <!-- 未打卡状态 -->
            <div class="tl-pending" id="tl-pending">
              <div class="timeline-detail">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                <span class="label">状态：</span>
                <span>未打卡</span>
              </div>
            </div>
            <!-- 已完成双人合拍状态 -->
            <div class="tl-done" id="tl-done" style="display:none;">
              <div class="timeline-detail">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                <span class="label">打卡方式：</span>
                <span>双人合拍</span>
              </div>
              <div class="timeline-detail">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
                <span class="label">WiFi名称：</span>
                <span>ditop2-5g</span>
              </div>
              <div class="timeline-detail">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="7" cy="12" r="1.5" fill="currentColor"/><path d="M12 12h6" stroke-linecap="round"/></svg>
                <span class="label">IP地址：</span>
                <span>192.168.110.102</span>
              </div>
              <div class="timeline-detail">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span class="label">考勤位置：</span>
                <span></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
    <div class="home-bar"></div>
  </div>
  <div class="side-btn btn-power"></div>
  <div class="side-btn btn-vol-up"></div>
  <div class="side-btn btn-vol-down"></div>
</div>

  <div class="demo-panel-card">
    <div class="demo-panel-title">（演示）打卡页场景：</div>
    <div class="demo-panel-subtitle">抽中双人验证后返回打卡页</div>
    <button class="demo-scenario active" id="scenario1" onclick="switchScenario(1)">
      <span class="dot blue"></span> 场景一：未抽（默认）
    </button>
    <button class="demo-scenario" id="scenario2" onclick="switchScenario(2)">
      <span class="dot orange"></span> 场景二：抽中后返回
    </button>
    <button class="demo-scenario" id="scenario3" onclick="switchScenario(3)">
      <span class="dot green"></span> 场景三：已完成双人合拍
    </button>
    <div class="demo-hint">点击切换场景查看效果</div>
  </div>

</div>

<script>
function switchScenario(n) {
  var btn1 = document.getElementById('scenario1');
  var btn2 = document.getElementById('scenario2');
  var btn3 = document.getElementById('scenario3');
  var warn = document.getElementById('doubleWarning');
  var tlOff = document.getElementById('tl-offduty');
  var tlLabel = document.getElementById('tl-offduty-label');
  var tlPend = document.getElementById('tl-pending');
  var tlDone = document.getElementById('tl-done');

  // Reset all buttons
  btn1.classList.remove('active');
  btn2.classList.remove('active');
  btn3.classList.remove('active');
  warn.classList.remove('show');

  // Reset timeline to pending state
  tlOff.classList.add('gray');
  tlLabel.textContent = '下班打卡';
  tlPend.style.display = 'block';
  tlDone.style.display = 'none';

  if (n === 1) {
    btn1.classList.add('active');
  } else if (n === 2) {
    btn2.classList.add('active');
    warn.classList.add('show');
  } else if (n === 3) {
    btn3.classList.add('active');
    // Hide warning, show completed timeline
    warn.classList.remove('show');
    tlOff.classList.remove('gray');
    tlLabel.textContent = '下班打卡 10:23';
    tlPend.style.display = 'none';
    tlDone.style.display = 'block';
  }
}
</script>
</body>
