<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的 - 赣建宝</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #e8ecf1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .phone {
      width: 380px;
      background: #fff;
      height: 100%;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .status-bar {
      height: 44px;
      background: linear-gradient(135deg, #2563ff 0%, #1e90ff 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .status-bar .time { font-size: 15px; }
    .status-bar .icons { display: flex; align-items: center; gap: 5px; }
    .status-bar .icons svg { width: 16px; height: 16px; fill: currentColor; }
    .status-bar .battery { display: flex; align-items: center; gap: 2px; font-size: 13px; }

    .header {
      background: linear-gradient(135deg, #2563ff 0%, #1e90ff 100%);
      padding: 12px 16px 32px;
      color: #fff;
      position: relative;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header-title { font-size: 17px; font-weight: 500; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .header-actions svg { width: 22px; height: 22px; }

    .user-info { display: flex; align-items: center; gap: 14px; }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: #e6f0ff;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar svg { width: 100%; height: 100%; }
    .user-meta { flex: 1; }
    .user-name { font-size: 20px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .badge {
      background: #ffb347;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .badge svg { width: 10px; height: 10px; fill: currentColor; }
    .badge.blue { background: #2563ff; }
    .edit-btn {
      background: rgba(255,255,255,0.22);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .edit-btn svg { width: 12px; height: 12px; }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      background: #fff;
      padding: 16px 0 8px;
    }
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      text-decoration: none;
      color: #333;
      position: relative;
    }
    .menu-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      color: #fff;
      position: relative;
    }
    .menu-icon svg { width: 26px; height: 26px; fill: currentColor; }
    .menu-text { font-size: 12px; color: #555; }

    .icon-pink { background: linear-gradient(135deg, #ff8da1, #ffb3c1); }
    .icon-cyan { background: linear-gradient(135deg, #4ecdc4, #7fdbda); }
    .icon-purple { background: linear-gradient(135deg, #a78bfa, #c4b5fd); }
    .icon-orange { background: linear-gradient(135deg, #ff9f68, #ffbf96); }
    .icon-blue { background: linear-gradient(135deg, #60a5fa, #93c5fd); }
    .icon-yellow { background: linear-gradient(135deg, #fbbf24, #fcd34d); }
    .icon-red { background: linear-gradient(135deg, #f87171, #fca5a5); }
    .icon-indigo { background: linear-gradient(135deg, #818cf8, #a5b4fc); }
    .icon-rose { background: linear-gradient(135deg, #fb7185, #fda4af); }
    .icon-amber { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .icon-slate { background: linear-gradient(135deg, #94a3b8, #cbd5e1); }

    .tabbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #999;
      font-size: 11px;
      text-decoration: none;
      position: relative;
    }
    .tab-item.active { color: #2563ff; }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-badge {
      position: absolute;
      top: -2px;
      right: 8px;
      width: 18px;
      height: 18px;
      background: #f44336;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .content-bottom { padding-bottom: 70px; }

    /* ===== Notification Card ===== */
    .partner-notice {
      margin: 0 16px;
      padding: 16px;
      background: linear-gradient(135deg, #fff3e0, #fff8e1);
      border: 1.5px solid #ffcc80;
      border-radius: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .partner-notice-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #fb923c);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .partner-notice-icon svg { width: 22px; height: 22px; fill: #fff; }
    .partner-notice-body { flex: 1; }
    .partner-notice-title { font-size: 14px; font-weight: 700; color: #e65100; margin-bottom: 4px; }
    .partner-notice-desc { font-size: 12px; color: #bf360c; line-height: 1.5; margin-bottom: 10px; }
    .partner-notice-actions { display: flex; gap: 8px; }
    .partner-notice-btn {
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      border: none;
    }
    .partner-notice-btn.accept { background: #f97316; color: #fff; }
    .partner-notice-btn.refuse { background: #fff; color: #888; border: 1px solid #ddd; }

    /* ===== Role indicator ===== */
    .role-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
      vertical-align: middle;
    }
    .role-tag.checkin { background: #e8f0fe; color: #2563ff; }
    .role-tag.partner { background: #fff3e0; color: #e65100; }

    /* ===== Demo Wrapper ===== */
    .demo-wrapper { display: flex; align-items: flex-start; justify-content: center; gap: 30px; flex-wrap: wrap; }
    .demo-panel {
      width: 240px;
      background: #fff;
      border-radius: 14px;
      padding: 20px 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      flex-shrink: 0;
      margin-top: 30px;
    }
    .demo-panel-title {
      font-size: 14px; font-weight: 700; color: #333; margin-bottom: 4px;
    }
    .demo-panel-sub {
      font-size: 11px; color: #999; margin-bottom: 16px;
    }
    .account-card {
      display: block;
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: #fafbfc;
      cursor: pointer;
      text-align: left;
      margin-bottom: 10px;
      transition: all 0.18s;
      position: relative;
    }
    .account-card:hover { border-color: #c4c8cd; background: #f0f2f4; }
    .account-card.active {
      border-color: #2563ff;
      background: #eef4ff;
      box-shadow: 0 0 0 3px rgba(37,99,255,0.08);
    }
    .account-card.active::after {
      content: '';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2563ff;
    }
    .account-card.active::before {
      content: '';
      position: absolute;
      right: 19px;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      z-index: 1;
    }
    .account-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .account-avatar.c-av1 { background: #e8f0fe; }
    .account-avatar.c-av1 svg { width: 20px; height: 20px; fill: #2563ff; }
    .account-avatar.c-av2 { background: #fff3e0; }
    .account-avatar.c-av2 svg { width: 20px; height: 20px; fill: #f97316; }
    .account-info { display: inline-flex; flex-direction: column; vertical-align: middle; }
    .account-name { font-size: 14px; font-weight: 700; color: #222; }
    .account-role { font-size: 11px; color: #888; margin-top: 2px; }
    .account-desc {
      font-size: 11px; color: #aaa; margin-top: 8px; padding-top: 8px;
      border-top: 1px dashed #e5e7eb; line-height: 1.5;
    }
    .account-desc strong { color: #555; }

    .flow-hint {
      font-size: 11px;
      color: #999;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
      line-height: 1.6;
    }
    .flow-hint .arrow { color: #2563ff; }

    /* Frame */
    .phone-frame {
      background: #1a1c1e;
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 0 0 2px #2d2f31, 0 0 0 5px #1a1c1e, 0 10px 45px rgba(0,0,0,0.45);
      position: relative;
      display: inline-block;
    }
    .phone-screen {
      width: 380px;
      height: 844px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      border: 1px solid #333;
    }
    .punch-hole {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 50%;
      z-index: 100;
    }
    .home-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 4px;
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
      z-index: 100;
    }
    .side-btn { position: absolute; background: #2d2f31; border-radius: 2px; opacity: 0.7; }
    .btn-power { right: -3px; top: 190px; width: 2px; height: 55px; }
    .btn-vol-up { left: -3px; top: 180px; width: 2px; height: 38px; }
    .btn-vol-down { left: -3px; top: 225px; width: 2px; height: 38px; }
  </style>
</head>

<script>
function switchAccount(role) {
  var card1 = document.getElementById('acctCard1');
  var card2 = document.getElementById('acctCard2');
  var notice = document.getElementById('partnerNotice');
  var badge  = document.getElementById('tabBadgeMsg');
  var userName = document.getElementById('userNameEl');
  var badgeRow = document.getElementById('badgeRowEl');
  var recordLink = document.getElementById('coPhotoRecordLink');
  var flowLabel = document.getElementById('currentRoleLabel');
  var tabMsg = document.getElementById('tabMessage');

  if (role === 'checkin') {
    card1.classList.add('active');
    card2.classList.remove('active');
    notice.style.display = 'none';
    badge.style.display = 'none';
    recordLink.style.display = '';
    userName.innerHTML = '德小拓';
    badgeRow.innerHTML = '<span class="badge"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>已实名</span>';
    flowLabel.textContent = '打卡人（德小拓）';
    tabMsg.href = 'mp-message.html';
  } else {
    card1.classList.remove('active');
    card2.classList.add('active');
    notice.style.display = 'none';
    badge.style.display = 'flex';
    recordLink.style.display = '';
    userName.innerHTML = '刘建国';
    badgeRow.innerHTML = '<span class="badge blue"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>施工员</span>';
    flowLabel.textContent = '合拍人（刘建国）';
    tabMsg.href = 'mp-message.html?role=partner';
  }
}
</script>
