<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>已拒绝合拍 - 赣建宝</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:#e8ecf1; display:flex; justify-content:center; align-items:center;
      min-height:100vh; padding:20px; gap:26px;
    }
    .phone { width:380px; background:#f5f6fa; height:100%; position:relative; overflow-y:auto; overflow-x:hidden; }

    .status-bar {
      height:44px; background:linear-gradient(135deg,#2563ff,#1e90ff);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px; color:#fff; font-size:14px; font-weight:600;
    }

    .header {
      background:linear-gradient(135deg,#ef4444,#dc2626);
      padding:4px 16px 20px; color:#fff;
    }
    .header-top { display:flex; align-items:center; gap:12px; }
    .back-btn {
      background:rgba(255,255,255,0.18); border:none; color:#fff;
      width:30px; height:30px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      text-decoration:none;
    }
    .back-btn svg { width:16px; height:16px; }
    .header-title { font-size:17px; font-weight:500; }

    .content { padding:16px 16px 24px; }

    .result-banner {
      text-align:center; padding:24px 0 16px;
    }
    .result-icon {
      width:72px; height:72px; border-radius:50%;
      background:#fff; margin:0 auto 16px;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 24px rgba(0,0,0,0.1);
    }
    .result-icon svg { width:40px; height:40px; stroke:#ef4444; }
    .result-title { font-size:20px; font-weight:700; color:#333; margin-bottom:6px; }
    .result-sub { font-size:13px; color:#666; }

    .reason-card {
      background:#fff; border-radius:16px; padding:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:16px;
    }
    .reason-label { font-size:13px; color:#888; margin-bottom:8px; }
    .reason-value {
      font-size:15px; font-weight:600; color:#333;
      background:#fef2f2; border:1px solid #fecaca;
      border-radius:8px; padding:10px 14px;
    }

    .what-next {
      background:#fff; border-radius:16px; padding:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:16px;
    }
    .what-next-title { font-size:15px; font-weight:600; color:#333; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
    .what-next-title svg { width:18px; height:18px; stroke:#f97316; }
    .next-item {
      display:flex; align-items:flex-start; gap:10px; margin-bottom:12px;
    }
    .next-item:last-child { margin-bottom:0; }
    .next-dot {
      width:6px; height:6px; background:#f97316; border-radius:50%;
      margin-top:5px; flex-shrink:0;
    }
    .next-text { font-size:13px; color:#555; line-height:1.6; }

    .btn-primary {
      width:100%; background:linear-gradient(135deg,#2563ff,#1e90ff);
      color:#fff; border:none; border-radius:12px; padding:14px;
      font-size:16px; font-weight:600; cursor:pointer;
      text-decoration:none; display:block; text-align:center;
      margin-bottom:10px;
    }
    .btn-secondary {
      width:100%; background:#fff; color:#888; border:1px solid #ddd;
      border-radius:12px; padding:14px; font-size:15px; cursor:pointer;
      text-decoration:none; display:block; text-align:center;
    }

    /* Frame */
    .phone-frame { background:#1a1c1e; border-radius:22px; padding:10px; box-shadow:0 0 0 2px #2d2f31,0 0 0 5px #1a1c1e,0 10px 45px rgba(0,0,0,0.45); position:relative; display:inline-block; }
    .phone-screen { width:380px; height:844px; border-radius:14px; overflow:hidden; position:relative; border:1px solid #333; }
    .punch-hole { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:10px; height:10px; background:#111; border:1px solid #333; border-radius:50%; z-index:100; }
    .home-bar { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:110px; height:4px; background:rgba(255,255,255,0.22); border-radius:2px; z-index:100; }
    .side-btn { position:absolute; background:#2d2f31; border-radius:2px; opacity:0.7; }
    .btn-power { right:-3px; top:190px; width:2px; height:55px; }
    .btn-vol-up { left:-3px; top:180px; width:2px; height:38px; }
    .btn-vol-down { left:-3px; top:225px; width:2px; height:38px; }
  </style>
</head>
<body>

  <div class="phone-frame">
  <div class="phone-screen">
    <div class="punch-hole"></div>
    <div class="phone">

    <div class="status-bar">
      <span>10:31</span>
      <div style="display:flex;align-items:center;gap:5px;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M17 4h-3V2h-4v2H7v18h10V4z"/></svg>
      </div>
    </div>

    <div class="header">
      <div class="header-top">
        <a href="mp-message.html?role=partner" class="back-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg>
        </a>
        <span class="header-title">合拍确认结果</span>
      </div>
    </div>

    <div class="content">
      <div class="result-banner">
        <div class="result-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <div class="result-title">已拒绝合拍请求</div>
        <div class="result-sub" id="resultSub">您的拒绝已提交，系统将通知打卡人</div>
      </div>

      <div class="reason-card">
        <div class="reason-label">拒绝原因</div>
        <div class="reason-value" id="refuseReason">当前不在项目工地</div>
      </div>

      <div class="what-next">
        <div class="what-next-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
          后续处理
        </div>
        <div class="next-item">
          <div class="next-dot"></div>
          <div class="next-text">系统将自动通知打卡人<strong>德小拓</strong>，并从候选人池中为其重新分配下一位合拍人</div>
        </div>
        <div class="next-item">
          <div class="next-dot"></div>
          <div class="next-text">若所有候选人均已尝试且失败，打卡人将被降级为单人打卡</div>
        </div>
        <div class="next-item">
          <div class="next-dot"></div>
          <div class="next-text">您的拒绝记录将留存在系统中，供后续核查使用</div>
        </div>
      </div>

      <a href="mp-my.html" class="btn-primary">返回首页</a>
      <a href="mp-message.html?role=partner" class="btn-secondary">返回消息</a>
    </div>

    </div><!-- .phone -->
    <div class="home-bar"></div>
  </div>
  <div class="side-btn btn-power"></div><div class="side-btn btn-vol-up"></div><div class="side-btn btn-vol-down"></div>
</div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var reason = params.get('reason');
  if (reason) {
    document.getElementById('refuseReason').textContent = reason;
    document.getElementById('resultSub').textContent = '拒绝原因：' + reason + '，系统已通知打卡人';
  }
})();
</script>

</body>
</html>
